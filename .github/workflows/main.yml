name: "Build Android"

on:
  workflow_dispatch:
    
jobs:
    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v3.12.0
              with:
                distribution: 'oracle'
                java-version: '17'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              run: |
                VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
                echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build APKs
              run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

            - name: Rename APKs
              run: |
                mv build/app/outputs/flutter-apk/app-release.apk             build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_universal.apk
                mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_armeabi-v7a.apk
                mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_arm64-v8a.apk
                mv build/app/outputs/flutter-apk/app-x86_64-release.apk      build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_x86_64.apk

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: bloomee-android-v${{ env.VERSION }}
                path: |
                  build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_universal.apk
                  build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_armeabi-v7a.apk
                  build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_arm64-v8a.apk
                  build/app/outputs/flutter-apk/bloomee_tunes_v${{ env.VERSION }}_x86_64.apk
